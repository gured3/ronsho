<!doctype html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="論証カード">
<meta name="theme-color" content="#1f3a5f">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>論証カード</title>
<style>
:root{--fs:17px;--bg:#f2f3f5;--fg:#1a1d21;--sub:#5f6873;--card:#fff;--line:#d6dae0;--acc:#1f3a5f;--acc-fg:#fff;--link:#2160c4;--ok:#17834a;--mid:#b47800;--ng:#cc2f38;--cloze:#c3c9d2;--ink:#111111;--chip:#e5e8ed;--my:#ffe15a;--mp:#ffb0cc;--mb:#a3d2ff;--mg:#b6ec9f;--lab:#76818d;--hl:#e9eef6}
html[data-theme=dark]{--bg:#121418;--fg:#e6e8eb;--sub:#9ba4ae;--card:#1c1f24;--line:#323840;--acc:#8db3f5;--acc-fg:#0d1a2e;--link:#8db3f5;--ok:#3cc47a;--mid:#e5b030;--ng:#ff6b72;--cloze:#4a515b;--ink:#f2f2f2;--chip:#2a2f36;--my:rgba(255,214,0,.42);--mp:rgba(255,105,160,.45);--mb:rgba(70,160,255,.45);--mg:rgba(110,220,90,.40);--lab:#8a949e;--hl:#232a33}
@media (prefers-color-scheme:dark){html[data-theme=auto]{--bg:#121418;--fg:#e6e8eb;--sub:#9ba4ae;--card:#1c1f24;--line:#323840;--acc:#8db3f5;--acc-fg:#0d1a2e;--link:#8db3f5;--ok:#3cc47a;--mid:#e5b030;--ng:#ff6b72;--cloze:#4a515b;--ink:#f2f2f2;--chip:#2a2f36;--my:rgba(255,214,0,.42);--mp:rgba(255,105,160,.45);--mb:rgba(70,160,255,.45);--mg:rgba(110,220,90,.40);--lab:#8a949e;--hl:#232a33}}
*{box-sizing:border-box;transition:none!important;animation:none!important;scroll-behavior:auto!important}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
[data-act],.cz{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--card);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.top h1{font-size:17px;margin:0;flex:1}
#warn{font-size:12px;color:var(--ng)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px}
.wrap{max-width:820px;margin:0 auto}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
.tabs button{flex:1;height:52px;border:0;background:none;color:var(--sub);font-size:14px;touch-action:manipulation}
.tabs button.on{color:var(--link);font-weight:700;box-shadow:inset 0 3px 0 var(--link)}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:15px;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;white-space:nowrap}
.btn:active{background:var(--hl)}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn.dan{color:var(--ng)}
.btn.sm{min-height:40px;padding:0 10px;font-size:14px}
.btn.on{background:var(--hl);border-color:var(--link);color:var(--link);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.box h2{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:700}
.box h2.mt{margin-top:14px}
.box p{margin:6px 0;line-height:1.6}
.sub{color:var(--sub);font-size:13px;line-height:1.6}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 13px;border-radius:20px;border:0;background:var(--chip);color:var(--fg);font-size:14px;touch-action:manipulation}
.chip small{opacity:.7;margin-left:3px}
.chip.on{background:var(--acc);color:var(--acc-fg);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 8px}
.seg button{flex:1;min-height:42px;border:0;border-left:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;touch-action:manipulation;padding:0 4px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--acc);color:var(--acc-fg);font-weight:700}
.rowf{display:flex;align-items:center;gap:10px;margin:6px 0}
select{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-size:15px;max-width:100%}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.stline{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;margin:4px 0}
.c1{color:var(--ok)}.c2{color:var(--mid)}.c3{color:var(--ng)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* study */
.ovl{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;background:var(--bg)}
#study{z-index:10}#edit{z-index:20}
.sbar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:var(--card);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.prog{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;line-height:1.2}
.prog small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.tools,.tpanel,.mtools{display:flex;gap:6px;padding:6px 8px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.meta{margin-left:auto;font-size:12px;color:var(--sub)}
.hint{font-size:12px;color:var(--sub)}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.cscroll,.escroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 30px}
.card{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
.side{position:relative;padding:14px 16px 20px}
.side+.side{border-top:2px dashed var(--line)}
.deckline{font-size:12px;color:var(--sub);margin-bottom:4px}
.lab{font-size:12px;color:var(--lab);font-weight:700;margin:12px 0 2px;letter-spacing:.05em}
.fld{font-size:var(--fs);line-height:1.8;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.fld.ttl{font-weight:700}
.penmode .fld{-webkit-user-select:none;user-select:none}
.mk-y{background:linear-gradient(transparent 50%,var(--my) 50%)}
.mk-p{background:linear-gradient(transparent 50%,var(--mp) 50%)}
.mk-b{background:linear-gradient(transparent 50%,var(--mb) 50%)}
.mk-g{background:linear-gradient(transparent 50%,var(--mg) 50%)}
.cz{border-bottom:2px solid var(--link)}
.cz.hid{color:transparent;background:var(--cloze);border-radius:3px;border-bottom-color:transparent}
.cz.hid .mk{background:none}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.imgs img{max-width:100%;max-height:60vh;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
canvas.ink{position:absolute;left:0;top:0;pointer-events:none}
canvas.ink.on{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.abar{display:flex;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--card);border-top:1px solid var(--line);-webkit-user-select:none;user-select:none}
.abar .col{display:flex;flex-direction:column;gap:8px;width:100%;max-width:820px;margin:0 auto}
.rate{flex:1;min-height:60px;border-radius:12px;border:2px solid;background:var(--card);font-size:26px;font-weight:800;line-height:1.1;touch-action:manipulation}
.rate small{display:block;font-size:11px;font-weight:700}
.rate:active{background:var(--hl)}
.r1{color:var(--ok);border-color:var(--ok)}.r2{color:var(--mid);border-color:var(--mid)}.r3{color:var(--ng);border-color:var(--ng)}
.sum{padding:20px;text-align:center}
.sum h2{margin:0 0 10px;font-size:18px}
.bigpct{font-size:54px;font-weight:800;line-height:1.1}
.bigpct small{font-size:22px}
.sum .stline{justify-content:center;font-size:18px;margin:12px 0}
/* editor */
.ed label{display:block;font-size:13px;color:var(--sub);font-weight:700;margin:12px 0 4px}
.ed textarea,.ed input{width:100%;font-size:max(16px,var(--fs));line-height:1.6;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);display:block}
.ed textarea{resize:vertical;min-height:2.6em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sidehd{margin:20px 0 0;padding:6px 10px;border-radius:8px;background:var(--hl);font-weight:700;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.th{position:relative}
.th img{height:90px;max-width:160px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
.th .x{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:15px;border:0;background:var(--ng);color:#fff;font-size:14px}
.help{margin:16px 0;font-size:14px;line-height:1.7}
.help summary{cursor:pointer;color:var(--link)}
code{background:var(--hl);padding:1px 5px;border-radius:4px;font-size:.92em}
.ebtns{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
/* list */
.lbar input{width:100%;min-height:44px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lfil{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lfil select{flex:1 1 40%}
.lact{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.list{list-style:none;margin:6px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li{padding:10px 14px;border-top:1px solid var(--line);min-height:52px}
.list li:first-child{border-top:0}
.list li:active{background:var(--hl)}
.lt{font-weight:700;font-size:15px;line-height:1.4}
.ls{font-size:12px;color:var(--sub);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.mkd{font-weight:800;font-size:14px}
.m1{color:var(--ok)}.m2{color:var(--mid)}.m3{color:var(--ng)}.m0{color:var(--sub)}
.more{text-align:center;color:var(--link)}
.cols{font-size:13px;background:var(--hl);padding:8px;border-radius:8px;line-height:1.6}
#b_txt{width:100%;min-height:200px;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:8px}
#b_deck{min-height:40px;font-size:16px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-left:6px}
/* stats */
table.st{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st thead th{border-top:0;color:var(--sub);font-size:12px}
.bars{display:flex;align-items:stretch;height:150px;gap:3px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bar em{font-style:normal;font-size:10px;color:var(--sub);height:14px}
.bcol{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end}
.stack{width:100%;display:flex;flex-direction:column;border-radius:3px 3px 0 0;overflow:hidden}
.stack i{display:block}
.b1{background:var(--ok)}.b2{background:var(--mid)}.b3{background:var(--ng)}
.bar span{font-size:10px;color:var(--sub);height:14px}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);overflow:auto;-webkit-overflow-scrolling:touch}
#viewer img{display:block;max-width:100%;max-height:100%;margin:auto;position:absolute;inset:0}
#viewer.zoom img{max-width:none;max-height:none;position:static;margin:0}
#viewer .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;z-index:2}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;font-size:14px;max-width:90vw;text-align:center;pointer-events:none}
@media (max-width:420px){.row2{grid-template-columns:1fr}.btn.sm{padding:0 8px}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1 id="ttl">論証カード</h1><span id="warn" hidden></span></header>
  <main id="main"><div class="wrap" id="view"></div></main>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-v="home">ホーム</button>
    <button data-act="tab" data-v="cards">カード</button>
    <button data-act="tab" data-v="stats">記録</button>
    <button data-act="tab" data-v="settings">設定</button>
  </nav>
</div>
<div id="study" class="ovl" hidden></div>
<div id="edit" class="ovl" hidden></div>
<div id="viewer" hidden><button class="x" data-act="vclose">✕</button><img alt=""></div>
<div id="toast" hidden></div>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileJson" hidden>
<noscript>JavaScriptを有効にしてください。</noscript>
<script>
(()=>{'use strict';
const VERSION='1.0';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dayKey=(t)=>{const d=t instanceof Date?t:new Date(t==null?Date.now():t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}return a};
const strip=s=>String(s||'').replace(/\{\{|\}\}|\[\[[ypbg]\||\]\]/g,'');
const LAB={title:'論点名',ex:'典型例',kw:'キーワード',ron:'論証',shu:'趣旨',kih:'規範'};
const MARK={1:'○',2:'△',3:'✖'};
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

let toastT=0;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},ms||1800)}

/* ---------- 保存（IndexedDB） ---------- */
const DB={db:null,mem:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('ronsho-cards',1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('cards'))d.createObjectStore('cards',{keyPath:'id'});if(!d.objectStoreNames.contains('imgs'))d.createObjectStore('imgs',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{try{this.db.close()}catch(_){}};res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})},
  async init(){try{await this.open()}catch(e){this.mem={cards:new Map(),imgs:new Map(),kv:new Map()}}},
  _tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})},
  async run(store,mode,fn){try{return await this._tx(store,mode,fn)}catch(e){try{this.db.close()}catch(_){}await this.open();return this._tx(store,mode,fn)}},
  async all(st){if(this.mem)return[...this.mem[st].values()];return this.run(st,'readonly',s=>s.getAll())},
  async get(st,k){if(this.mem)return this.mem[st].get(k);return this.run(st,'readonly',s=>s.get(k))},
  async put(st,v,k){if(this.mem){this.mem[st].set(k===undefined?v.id:k,v);return}return this.run(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k))},
  async del(st,k){if(this.mem){this.mem[st].delete(k);return}return this.run(st,'readwrite',s=>s.delete(k))},
  async putMany(st,vs){if(!vs.length)return;if(this.mem){vs.forEach(v=>this.mem[st].set(v.id,v));return}return this.run(st,'readwrite',s=>{vs.forEach(v=>s.put(v))})},
  async delMany(st,ks){if(!ks.length)return;if(this.mem){ks.forEach(k=>this.mem[st].delete(k));return}return this.run(st,'readwrite',s=>{ks.forEach(k=>s.delete(k))})},
  async clear(st){if(this.mem){this.mem[st].clear();return}return this.run(st,'readwrite',s=>s.clear())}
};

/* ---------- 状態 ---------- */
const A={cards:[],byId:new Map(),imgCache:new Map(),set:{},hist:{},
  home:{decks:[],tags:[],mode:'all',order:'rand',limit:0,repeat:true},
  list:{q:'',deck:'',tag:'',mark:'',sort:'u',shown:200},
  view:'home',S:null,saved:null,undo:[],tool:'',E:null,lastDeck:'',lastBackup:0,ros:[],listIds:[],impMode:'merge'};
const Ink={mode:false,tool:'pen',color:'k',width:'thin',undo:[],cur:null,fs:null,k:'#111',pend:new Set(),t:0};

function normCard(c){
  c=c||{};c.id=c.id||uid();c.deck=String(c.deck||'').trim()||'未分類';
  c.tags=Array.isArray(c.tags)?c.tags.map(String).filter(Boolean):String(c.tags||'').split(/[\s,、，]+/).filter(Boolean);
  c.f=Object.assign({title:'',ex:'',kw:'',ron:'',shu:'',kih:''},c.f||{});
  c.img=Object.assign({front:[],back:[]},c.img||{});c.ink=Object.assign({front:[],back:[]},c.ink||{});
  c.st=Object.assign({n:0,o:0,t:0,x:0,last:0,at:0},c.st||{});
  c.c=c.c||Date.now();c.u=c.u||c.c;c.m=c.m||c.u;return c;
}
function reindex(){A.byId=new Map(A.cards.map(c=>[c.id,c]))}
async function saveCard(c){c.m=Date.now();try{await DB.put('cards',c)}catch(e){toast('保存に失敗しました：'+(e&&e.message||e),3000)}}
const saveSet=()=>DB.put('kv',A.set,'settings').catch(()=>{});
const saveHome=()=>DB.put('kv',A.home,'home').catch(()=>{});
const saveHist=()=>DB.put('kv',A.hist,'hist').catch(()=>{});
function saveSess(){const S=A.S;if(!S)return;if(S.done){A.saved=null;DB.del('kv','session').catch(()=>{})}else{A.saved=S;DB.put('kv',S,'session').catch(()=>{})}}

async function getImg(id){if(A.imgCache.has(id))return A.imgCache.get(id);let r=null;try{r=await DB.get('imgs',id)}catch(_){}const d=r&&r.d;if(d)cacheImg(id,d);return d}
function cacheImg(id,d){A.imgCache.set(id,d);if(A.imgCache.size>80){const k=A.imgCache.keys().next().value;if(!(A.E&&A.E.newImgs.has(k)))A.imgCache.delete(k)}}
function fillImgs(root){$$('img[data-img]',root).forEach(async im=>{const d=await getImg(im.dataset.img);if(d)im.src=d;else im.alt='（画像なし）'})}

/* ---------- 書式：{{隠す}} と [[y|マーカー]] ---------- */
function parseMU(s){
  s=String(s||'');const text=[],cl=[],mk=[],map=[];let inC=false,col='',i=0;
  while(i<s.length){
    if(!inC&&s.startsWith('{{',i)){inC=true;i+=2;continue}
    if(inC&&s.startsWith('}}',i)){inC=false;i+=2;continue}
    if(!col&&s.startsWith('[[',i)&&/[ypbg]/.test(s[i+2]||'')&&s[i+3]==='|'){col=s[i+2];i+=4;continue}
    if(col&&s.startsWith(']]',i)){col='';i+=2;continue}
    text.push(s[i]);cl.push(inC);mk.push(col);map.push(i);i++;
  }
  return {text:text.join(''),cl,mk,map};
}
function serMU(m){
  let out='',inC=false,col='';
  for(let i=0;i<m.text.length;i++){const c=m.cl[i],k=m.mk[i];
    if(col&&(k!==col||c!==inC)){out+=']]';col=''}
    if(inC&&!c){out+='}}';inC=false}
    if(!inC&&c){out+='{{';inC=true}
    if(!col&&k){out+='[['+k+'|';col=k}
    out+=m.text[i];}
  if(col)out+=']]';if(inC)out+='}}';return out;
}
function modify(m,a,b,op){for(let i=Math.max(0,a);i<Math.min(b,m.text.length);i++){if(op==='hide')m.cl[i]=true;else if(op==='unhide')m.cl[i]=false;else if(op==='clear')m.mk[i]='';else m.mk[i]=op}}
function srcToText(m,p){let n=0;while(n<m.map.length&&m.map[n]<p)n++;return n}
function renderMU(s,reveal){
  const m=parseMU(s);let h='',i=0,g=0,prevC=false;const L=m.text.length;
  while(i<L){let j=i;while(j<L&&m.cl[j]===m.cl[i]&&m.mk[j]===m.mk[i])j++;
    let t=esc(m.text.slice(i,j));if(m.mk[i])t='<span class="mk mk-'+m.mk[i]+'">'+t+'</span>';
    if(m.cl[i]){if(!prevC)g++;t='<span class="cz'+(reveal?'':' hid')+'" data-g="'+g+'">'+t+'</span>'}
    h+=t;prevC=m.cl[i];i=j;}
  return h;
}

async function load(){

  const [cards,set,hist,seeded,lastBk,sess,home,lastDeck]=await Promise.all([DB.all('cards').catch(()=>[]),g('settings'),g('hist'),g('seeded'),g('lastBackup'),g('session'),g('home'),g('lastDeck')]);
  A.cards=(cards||[]).map(normCard).sort((a,b)=>a.c-b.c);
  A.set=Object.assign({fs:17,theme:'auto',pencil:false,titleFront:false},set||{});
  A.hist=hist||{};A.lastBackup=lastBk||0;A.saved=(sess&&sess.ids&&!sess.done)?sess:null;A.lastDeck=lastDeck||'';

  if(!seeded&&!A.cards.length){A.cards=samples();await DB.putMany('cards',A.cards).catch(()=>{});await DB.put('kv',true,'seeded').catch(()=>{})}
  reindex();applySettings();
}

  finally{URL.revokeObjectURL(url)}
}

function parseDSV(t,dl){
  const rows=[];let row=[],cell='',q=false,i=0;t=t.replace(/\r\n?/g,'\n');
  while(i<t.length){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i+=2;continue}q=false;i++;continue}cell+=c;i++;continue}
    if(c==='"'&&cell===''){q=true;i++;continue}
    if(c===dl){row.push(cell);cell='';i++;continue}
    if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';i++;continue}
    cell+=c;i++;}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function bulkRows(){const t=$('#b_txt').value;if(!t.trim())return[];const rows=parseDSV(t,t.includes('\t')?'\t':',');if(rows.length&&/^(論点名?|タイトル|title)$/i.test((rows[0][0]||'').trim()))rows.shift();return rows.filter(r=>r.slice(0,6).some(x=>(x||'').trim()))}

  seg:b=>{const k=b.dataset.k,v=b.dataset.v;if(b.dataset.s==='home'){A.home[k]=v;saveHome();VIEWS.home()}else{A.set[k]=k==='fs'?+v:v;saveSet();applySettings();VIEWS.settings()}},
  start:()=>{const H=A.home;let ids=modeFilter(poolBase(),H.mode).map(c=>c.id);ids=orderIds(ids);if(H.limit)ids=ids.slice(0,H.limit);startSession(ids)},
  resume:()=>{if(!A.saved)return;A.S=A.saved;A.undo=[];Ink.undo=[];openStudy()},
  flip:()=>flip(),
  rate:b=>rate(+b.dataset.r),
  sUndo:()=>undo(),
  sEnd:()=>endStudy(),
  sHome:()=>endStudy(),
  sReveal:()=>{const S=A.S;if(!S||S.done)return;S.reveal=!S.reveal;$$('#studyCard .cz').forEach(z=>z.classList.toggle('hid',!S.reveal))},
  sEdit:()=>{const c=curCard();if(c)openEditor(c.id)},
  again:b=>{const S=A.S;let ids=b.dataset.w?Object.keys(S.res).filter(id=>S.res[id]>1):S.all;ids=ids.filter(id=>A.byId.has(id));startSession(orderIds(ids))},
  tool:b=>{const t=b.dataset.t;A.tool=A.tool===t?'':t;selCache=null;updateToolUI()},
  mk:b=>applyMark(b.dataset.op),
  pc:b=>{Ink.tool='pen';Ink.color=b.dataset.c;updateToolUI()},
  pw:b=>{Ink.width=b.dataset.w;Ink.tool='pen';updateToolUI()},
  er:()=>{Ink.tool='eraser';updateToolUI()},
  iu:()=>inkUndo(),
  ic:()=>inkClear(),
  new:()=>openEditor(null),
  edit:b=>openEditor(b.dataset.id),
  more:()=>{A.list.shown+=300;renderList()},
  bulk:()=>go('bulk'),
  bulkAdd:()=>bulkAdd(),
  studyList:()=>startSession(orderIds(A.listIds)),
  studyWeak:()=>startSession(orderIds(weakCards().map(c=>c.id))),
  eCancel:()=>eCancel(),
  eSave:()=>eSave(false),
  eSaveNext:()=>eSave(true),
  eDup:()=>eDup(),
  eDel:()=>eDel(),
  emk:b=>emk(b.dataset.op),
  eImg:b=>{A.imgSide=b.dataset.side;const f=$('#fileImg');f.value='';f.click()},
  eImgDel:b=>{const E=A.E,s=b.dataset.side;E.img[s].splice(+b.dataset.i,1);renderThumbs(s);updatePreview()},
  eClearInk:()=>{if(confirm('このカードの手書きを消しますか？（保存すると確定）')){A.E.clearInk=true;const p=$('#inkInfo');if(p)p.textContent='手書きは保存時に消去されます。'}},
  export:()=>exportData().catch(e=>toast('書き出しに失敗しました：'+e.message,3000)),
  imp:b=>{A.impMode=b.dataset.m;const f=$('#fileJson');f.value='';f.click()},
  resetStats:async()=>{if(!confirm('すべてのカードの学習記録（○△✖・正答率・日別記録）を消しますか？'))return;A.cards.forEach(c=>{c.st={n:0,o:0,t:0,x:0,last:0,at:0}});A.hist={};await DB.putMany('cards',A.cards);await saveHist();A.saved=null;DB.del('kv','session').catch(()=>{});toast('リセットしました');VIEWS.settings()},
  delSamples:async()=>{if(!confirm('サンプルカードを削除しますか？'))return;await delCards(A.cards.filter(c=>c.sample));toast('削除しました');VIEWS.settings()},
  delAll:async()=>{if(!confirm(`すべてのカード（${A.cards.length}枚）を削除しますか？\n元に戻せません。先に書き出しておくことをおすすめします。`))return;await DB.clear('cards');await DB.clear('imgs');A.cards=[];reindex();A.imgCache.clear();A.saved=null;DB.del('kv','session').catch(()=>{});toast('削除しました');VIEWS.settings()},
  vclose:()=>{$('#viewer').hidden=true;$('#viewer img').src=''}
};
const CH={
  limit:t=>{A.home.limit=+t.value;saveHome();VIEWS.home()},
  repeat:t=>{A.home.repeat=t.checked;saveHome()},
  titleFront:t=>{A.set.titleFront=t.checked;saveSet()},
  pencil:t=>{A.set.pencil=t.checked;saveSet()},
  ldeck:t=>{A.list.deck=t.value;A.list.shown=200;renderList()},
  ltag:t=>{A.list.tag=t.value;A.list.shown=200;renderList()},
  lmark:t=>{A.list.mark=t.value;A.list.shown=200;renderList()},
  lsort:t=>{A.list.sort=t.value;renderList()}
};

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#viewer')){if(t.tagName==='IMG'){$('#viewer').classList.toggle('zoom');return}if(!t.closest('[data-act]')){ACT.vclose();return}}
  const cz=t.closest('.cz');
  if(cz&&cz.closest('.card')&&!Ink.mode){const s=getSelection();if(s&&!s.isCollapsed&&String(s).length)return;const f=cz.closest('.fld');const hid=cz.classList.contains('hid');$$('.cz[data-g="'+cz.dataset.g+'"]',f).forEach(z=>z.classList.toggle('hid',!hid));return}
  const im=t.closest('.card img[data-img]');if(im&&!Ink.mode&&im.src){openViewer(im.src);return}
  const b=t.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){f(b,e)}
});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.ch;if(k&&CH[k])CH[k](t)});
document.addEventListener('mousedown',e=>{if(e.target.closest('.keepsel'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#cardBox'))selCache=null},true);
document.addEventListener('selectionchange',()=>{
  const ae=document.activeElement;if(ae&&ae.tagName==='TEXTAREA')trackTA(ae);
  if(A.view!=='study')return;const s=getSelection();if(!s||!s.rangeCount||s.isCollapsed)return;
  const r=s.getRangeAt(0),cb=$('#cardBox');if(cb&&cb.contains(r.commonAncestorContainer)){const x=rangeToFields(r,cb);if(x.length)selCache=x}
});
['select','keyup','pointerup','focusin'].forEach(ev=>document.addEventListener(ev,e=>trackTA(e.target),true));
document.addEventListener('input',e=>{const t=e.target;
  if(t.closest&&t.closest('#edit')){if(t.tagName==='TEXTAREA')autoGrow(t);updatePreview();return}
  if(t.id==='q'){clearTimeout(A.qT);A.qT=setTimeout(()=>{A.list.q=t.value;A.list.shown=200;if(A.view==='cards'&&$('#list'))renderList()},150)}
  if(t.id==='b_txt'){const n=bulkRows().length;$('#b_info').textContent=n?`${n}枚として読み取りました`:''}
});
document.addEventListener('paste',e=>{
  if(!A.E||$('#edit').hidden)return;const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  const files=[];for(const it of items)if(it.kind==='file'&&/^image\//.test(it.type)){const f=it.getAsFile();if(f)files.push(f)}
  if(!files.length)return;e.preventDefault();const side=lastTA&&lastTA.el?sideOfKey(lastTA.el.dataset.k):'back';addImages(files,side);toast(side==='front'?'表に画像を追加':'裏に画像を追加');
});
$('#fileImg').addEventListener('change',e=>{const fs=[...e.target.files];if(fs.length)addImages(fs,A.imgSide||'back')});
$('#fileJson').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;let d;
  try{d=JSON.parse(await readAs(f,'text'))}catch(_){toast('ファイルを読めません',2500);return}
  if(!d||d.app!=='ronsho-cards'||!Array.isArray(d.cards)){toast('このアプリのバックアップファイルではありません',3000);return}
  if(A.impMode==='replace'&&!confirm(`今のカード${A.cards.length}枚をすべて消して、ファイルの${d.cards.length}枚に置き換えます。よろしいですか？`))return;
  try{await importData(d,A.impMode)}catch(err){toast('読み込みに失敗しました：'+(err&&err.message||err),3500)}
});
document.addEventListener('keydown',e=>{
  if(!$('#viewer').hidden&&e.key==='Escape'){ACT.vclose();return}
  if(A.view!=='study'||!$('#edit').hidden||$('#study').hidden)return;
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;const S=A.S,k=e.key;if(!S)return;
  const done=()=>{e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()};
  if(k==='Escape'){done();endStudy();return}
  if(k==='u'||k==='U'){done();undo();return}
  if(S.done)return;
  if(k===' '||k==='Enter'){done();if(!S.flip)flip();return}
  if(S.flip&&(k==='1'||k==='2'||k==='3')){done();rate(+k)}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushInk()});
window.addEventListener('pagehide',flushInk);
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(A.view==='study'){Ink.k=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();redrawAll()}});

(async function init(){
  if(/^https?:$/.test(location.protocol)){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
  try{await load()}catch(e){toast('読み込みエラー：'+(e&&e.message||e),4000)}
  if(DB.mem){const w=$('#warn');w.hidden=false;w.textContent='保存できない環境です'}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  go('home');
})();
})();
</script>
</body>
