<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="論PASS">
<meta name="theme-color" content="#0d1e3a">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>論PASS</title>
<style>
:root{--fs:20px;--ls:0em;--lh:1.9;--bg:#f2f6fc;--fg:#1f2a3c;--sub:#66758c;--card:#fff;--line:#dae4f2;--acc:#2f7de1;--acc-d:#1f5fb3;--acc-fg:#fff;--acc2:#1e9bd7;--acc2-d:#1676a6;--link:#2f7de1;--ok:#5a937a;--ok-d:#40705b;--mid:#c3a253;--mid-d:#977a35;--ng:#bf6b6b;--ng-d:#934d4d;--cloze:#cddcf2;--ink:#1f2a3c;--chip:#e5edf9;--hl:#eaf2fe;--lab:#2f7de1;--labbg:#e3eefd;--my:#ffe15a;--mp:#ffb0cc;--mb:#a3d2ff;--mg:#b6ec9f;--nickbg:#e3eefd;--nick:#1f5fb3;--citebg:#e4f4f1;--cite:#2c6e63;--memobg:#fbfdff;--relbg:#eef4fc;--kwbg:#f4f7fb;--shadow:rgba(40,80,150,.13);--hd1:#0d1e3a;--hd2:#173563}
html[data-theme=dark]{--bg:#121a26;--fg:#e8eef7;--sub:#9aabc2;--card:#1b2635;--line:#2d3c52;--acc:#5b9cf0;--acc-d:#3b72bb;--acc-fg:#fff;--acc2:#4cb4e6;--acc2-d:#2d84ad;--link:#7fb2f5;--ok:#5f9b80;--ok-d:#40705b;--mid:#b89a52;--mid-d:#8a7236;--ng:#b56a6a;--ng-d:#874c4c;--cloze:#34475f;--ink:#e8eef7;--chip:#24344a;--hl:#22324a;--lab:#7fb2f5;--labbg:#22324a;--my:rgba(255,214,0,.42);--mp:rgba(255,105,160,.45);--mb:rgba(70,160,255,.45);--mg:rgba(110,220,90,.40);--nickbg:#22324a;--nick:#9cc4f8;--citebg:#1d3a37;--cite:#8fd3c4;--memobg:#1e2a3a;--relbg:#1f2c3e;--kwbg:#1f2c3e;--shadow:rgba(0,0,0,.35);--hd1:#0a1730;--hd2:#132b52}
@media (prefers-color-scheme:dark){html[data-theme=auto]{--bg:#121a26;--fg:#e8eef7;--sub:#9aabc2;--card:#1b2635;--line:#2d3c52;--acc:#5b9cf0;--acc-d:#3b72bb;--acc-fg:#fff;--acc2:#4cb4e6;--acc2-d:#2d84ad;--link:#7fb2f5;--ok:#5f9b80;--ok-d:#40705b;--mid:#b89a52;--mid-d:#8a7236;--ng:#b56a6a;--ng-d:#874c4c;--cloze:#34475f;--ink:#e8eef7;--chip:#24344a;--hl:#22324a;--lab:#7fb2f5;--labbg:#22324a;--my:rgba(255,214,0,.42);--mp:rgba(255,105,160,.45);--mb:rgba(70,160,255,.45);--mg:rgba(110,220,90,.40);--nickbg:#22324a;--nick:#9cc4f8;--citebg:#1d3a37;--cite:#8fd3c4;--memobg:#1e2a3a;--relbg:#1f2c3e;--kwbg:#1f2c3e;--shadow:rgba(0,0,0,.35);--hd1:#0a1730;--hd2:#132b52}}
*{box-sizing:border-box;transition:none!important;animation:none!important;scroll-behavior:auto!important}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",-apple-system,sans-serif;font-size:17px;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
[data-act],.cz{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(100deg,var(--hd1),var(--hd2));color:#fff;-webkit-user-select:none;user-select:none}
.top h1{font-size:21px;margin:0;flex:1;font-weight:800;letter-spacing:.04em}
#logo{height:34px;width:auto;display:block;margin-right:auto}
.syncb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;min-height:36px;padding:0 12px;font-size:13px;font-weight:700;white-space:nowrap}
.syncb.err{background:#b54848}
.fl{display:block;font-size:14px;color:var(--sub);font-weight:700;margin:10px 0}
.fl input{display:block;width:100%;min-height:46px;margin-top:4px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-size:16px}
.help ol{padding-left:1.3em;margin:6px 0}.help li{margin:4px 0}
#warn{font-size:13px;color:#fff;background:rgba(0,0,0,.2);border-radius:99px;padding:2px 10px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 30px}
.wrap{max-width:840px;margin:0 auto}
.tabs{display:flex;gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:var(--card);border-top:2px solid var(--line);-webkit-user-select:none;user-select:none}
.tabs button{flex:1;height:58px;border:0;border-radius:16px;background:none;color:var(--sub);font-size:13px;font-weight:700;touch-action:manipulation}
.tabs button i{display:block;font-style:normal;font-size:22px;line-height:1.15}
.tabs button.on{color:var(--acc);background:var(--hl)}
.btn{min-height:48px;padding:0 18px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);font-size:16px;font-weight:700;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.4}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);box-shadow:0 4px 0 var(--acc-d)}
.btn.pri:active{box-shadow:0 2px 0 var(--acc-d)}
.btn.big{width:100%;min-height:60px;font-size:19px}
.btn.dan{color:var(--ng)}
.btn.sm{min-height:44px;padding:0 13px;font-size:15px}
.btn.on{background:var(--acc2);border-color:var(--acc2);color:#fff;box-shadow:0 3px 0 var(--acc2-d)}
.box{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin:0 0 14px;box-shadow:0 5px 0 var(--shadow)}
.box h2{font-size:15px;color:var(--acc2);margin:0 0 10px;font-weight:800}
.box h2.mt{margin-top:16px}
.box p{margin:6px 0;line-height:1.7}
.sub{color:var(--sub);font-size:14px;line-height:1.7}
.mt8{margin-top:10px}.mt12{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--chip);color:var(--fg);font-size:16px;font-weight:700;touch-action:manipulation}
.chip small{opacity:.7;margin-left:4px}
.chip.on{background:var(--acc2);color:#fff;box-shadow:0 3px 0 var(--acc2-d)}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px;margin:6px 0 10px}
.seg button{flex:1;min-width:0;min-height:44px;border:0;border-radius:999px;background:none;color:var(--fg);font-size:15px;font-weight:700;touch-action:manipulation;padding:0 4px}
.seg button.on{background:var(--acc);color:var(--acc-fg);box-shadow:0 3px 0 var(--acc-d)}
.rowf{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}
select{min-height:46px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:0 10px;font-size:16px;max-width:100%}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--acc)}
.stline{display:flex;flex-wrap:wrap;gap:16px;font-size:17px;margin:4px 0}
.c1{color:var(--ok)}.c2{color:var(--mid-d)}.c3{color:var(--ng)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.ovl{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;background:var(--bg)}
#study{z-index:10}#edit{z-index:20}#pad{z-index:30}
.sbar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:var(--card);border-bottom:2px solid var(--line);-webkit-user-select:none;user-select:none}
.prog{flex:1;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:19px;line-height:1.2;color:var(--acc)}
.prog small{display:block;font-size:12px;color:var(--sub);font-weight:700}
/* 学習画面：上部のバーを1段に統合（幅が足りない端末では折り返す） */
.sbar.sstudy{flex-wrap:wrap;row-gap:4px;column-gap:5px}
.sbar.sstudy .btn.sm{min-height:42px;padding:0 10px;font-size:14px}
.sbar.sstudy .prog{flex:1 1 96px;min-width:0;font-size:17px}
.sbar.sstudy .prog small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgrp{display:contents}
.seg.wrap{flex-wrap:wrap;border-radius:24px}
.seg.wrap button{flex:1 1 auto;padding:0 12px}
.tools,.tpanel,.mtools{display:flex;gap:6px;padding:7px 8px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:2px solid var(--line);-webkit-user-select:none;user-select:none}
.meta{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.hint{font-size:13px;color:var(--sub)}
.sep{width:2px;height:28px;background:var(--line);margin:0 2px;border-radius:2px}
.dot{display:inline-block;width:13px;height:13px;border-radius:7px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.cscroll,.escroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 34px}
/* 縦スクロールだけブラウザに任せ、横スワイプはJSで受け取る（iPadでpointercancelされるのを防ぐ） */
.cscroll{touch-action:pan-y;-webkit-user-select:auto}
.card{max-width:840px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shadow);overflow:hidden}
.side{position:relative;padding:16px 18px 22px}
.side[data-side=front]{border-top:8px solid var(--acc2)}
.side+.side{border-top:3px dashed var(--line);background:linear-gradient(var(--card),var(--card))}
.deckline{font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:700}
.lab{display:inline-block;background:var(--labbg);color:var(--lab);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;margin:14px 0 6px;letter-spacing:.06em}
.fld{font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.fb-title{font-size:calc(var(--fs) * 1.2);font-weight:800;color:var(--nick);background:var(--nickbg);border-radius:18px;padding:8px 16px;margin:4px 0 12px;line-height:1.5}
.fb-cite{font-size:calc(var(--fs) * .88);font-weight:700;color:var(--cite);background:var(--citebg);border-radius:18px;padding:8px 16px;margin:0 0 12px}
.brow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:4px 0 12px}
.brow>.fld{margin:0}
.brow>.fb-title{flex:1 1 52%;min-width:130px}
.brow>.fb-cite{flex:1 1 38%;min-width:120px;font-size:calc(var(--fs) * .74);line-height:1.55;padding:8px 12px}
.brow>.fb-title{line-height:min(1.4,var(--lh))}
.fb-ex{margin:12px 0 0}
.fb-kw{margin-top:12px;background:var(--kwbg);border-left:5px solid var(--acc);border-radius:10px;padding:6px 14px;font-weight:700}
.relbox+.fld{margin-top:12px}
.navb{flex:0 0 56px;min-height:60px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--sub);font-size:24px;font-weight:900;touch-action:manipulation;box-shadow:0 3px 0 var(--line)}
.navb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.navb:disabled{opacity:.35}
.abar .flipb{flex:1;width:auto}
.smain{flex:1;display:flex;flex-direction:column;min-height:0}
#study.hz .smain{flex-direction:row}
#study.hz .abar{order:-1;flex-direction:column;width:92px;flex:none;border-top:0;border-right:2px solid var(--line);padding:10px 8px calc(env(safe-area-inset-bottom) + 10px)}
#study.hz .abar .navb{flex:0 0 58px;width:100%}
#study.hz .abar .rate{flex:0 1 130px;width:100%;min-height:64px}
#study.hz .abar{justify-content:center}
#study.hz .abar .flipb{flex:1 1 0;width:100%;min-height:0;padding:0;writing-mode:vertical-rl;letter-spacing:.3em}
#study.hz .card{display:flex;max-width:none;align-items:stretch}
#study.hz .side{flex:1 1 0;min-width:0}
#study.hz .side+.side{border-top:0;border-left:3px dashed var(--line)}
.side.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:700;background:var(--hl)}
.fb-memo{background:var(--memobg);border:2px dashed var(--line);border-radius:18px;padding:10px 16px}
.relbox{background:var(--relbg);border-radius:20px;padding:10px;margin-bottom:4px}
.relbox img{display:block;max-width:100%;max-height:var(--imgmax,55vh);margin:0 auto 8px;border-radius:14px;background:#fff;cursor:zoom-in}
.relbox img:last-child{margin-bottom:0}
.reltxt{padding:2px 8px;font-weight:700}
.penmode .fld{-webkit-user-select:none;user-select:none}
.mk-y{background:var(--my)}.mk-p{background:var(--mp)}.mk-b{background:var(--mb)}.mk-g{background:var(--mg)}
.mk{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sw{display:inline-block;width:22px;height:13px;border-radius:4px;margin-right:4px;vertical-align:-1px;opacity:.6}
.cz{border-bottom:3px solid var(--acc2)}
.cz.hid{color:transparent;background:var(--cloze);border-radius:8px;border-bottom-color:transparent}
.cz.hid .mk{background:none}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.side[data-side=back]>.imgs:first-child{margin:0 0 12px}
.imgs img{max-width:100%;max-height:var(--imgmax,60vh);border-radius:14px;border:2px solid var(--line);cursor:zoom-in;background:#fff}
canvas.ink{position:absolute;left:0;top:0;pointer-events:none}
canvas.ink.on{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.abar{display:flex;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:var(--card);border-top:2px solid var(--line);-webkit-user-select:none;user-select:none}
.abar .col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:840px;margin:0 auto}
.rate{flex:1;min-height:60px;border-radius:18px;border:0;color:#fff;font-size:32px;font-weight:900;line-height:1;touch-action:manipulation}
.r1{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}.r2{background:var(--mid);box-shadow:0 5px 0 var(--mid-d)}.r3{background:var(--ng);box-shadow:0 5px 0 var(--ng-d)}
.rate:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sum{padding:24px;text-align:center}
.sum h2{margin:0 0 10px;font-size:21px;color:var(--acc2)}
.bigpct{font-size:64px;font-weight:900;line-height:1.1;color:var(--acc)}
.bigpct small{font-size:24px}
.sum .stline{justify-content:center;font-size:20px;margin:12px 0}
.ed label{display:block;font-size:14px;color:var(--sub);font-weight:800;margin:14px 0 5px}
.ed textarea,.ed input{width:100%;font-size:max(16px,var(--fs));line-height:1.6;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);display:block}
.ed textarea:focus,.ed input:focus{outline:none;border-color:var(--acc2)}
.ed textarea{resize:vertical;min-height:2.6em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sidehd{margin:22px 0 0;padding:8px 14px;border-radius:999px;background:var(--acc2);color:#fff;font-weight:800;font-size:15px;display:inline-block}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.th{position:relative}
.th img{height:96px;max-width:170px;object-fit:cover;border-radius:12px;border:2px solid var(--line);display:block;background:#fff}
.th .x,.th .pe{position:absolute;width:32px;height:32px;border-radius:16px;border:0;color:#fff;font-size:14px}
.th .x{top:-8px;right:-8px;background:var(--ng)}
.th .pe{bottom:-8px;right:-8px;background:var(--acc2)}
.help{margin:16px 0;font-size:15px;line-height:1.8}
.help summary{cursor:pointer;color:var(--link);font-weight:700}
code{background:var(--hl);padding:1px 6px;border-radius:6px;font-size:.92em}
.ebtns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.lbar input{width:100%;min-height:50px;font-size:17px;padding:0 18px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.lfil{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.lfil select{flex:1 1 40%}
.lact{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.list{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--shadow)}
.list li{padding:12px 16px;border-top:2px solid var(--line);min-height:56px}
.list li:first-child{border-top:0}
.list li:active{background:var(--hl)}
.lt{font-weight:800;font-size:17px;line-height:1.4}
.ls{font-size:13px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.mkd{font-weight:900;font-size:16px}
.m1{color:var(--ok)}.m2{color:var(--mid-d)}.m3{color:var(--ng)}.m0{color:var(--sub)}
.more{text-align:center;color:var(--link);font-weight:700}
.cols{font-size:14px;background:var(--hl);padding:10px;border-radius:14px;line-height:1.7;font-weight:700}
#b_txt{width:100%;min-height:200px;font-size:15px;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--card);margin-top:8px}
#b_deck{min-height:44px;font-size:16px;padding:0 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin-left:6px}
table.st{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:8px 4px;border-top:2px solid var(--line);text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st thead th{border-top:0;color:var(--sub);font-size:13px}
.bars{display:flex;align-items:stretch;height:160px;gap:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bar em{font-style:normal;font-size:11px;color:var(--sub);height:15px}
.bcol{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end}
.stack{width:100%;display:flex;flex-direction:column;border-radius:8px 8px 3px 3px;overflow:hidden}
.stack i{display:block}
.b1{background:var(--ok)}.b2{background:var(--mid)}.b3{background:var(--ng)}
.bar span{font-size:11px;color:var(--sub);height:15px}
.padwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#padCv{background:#fff;border-radius:18px;box-shadow:0 5px 0 var(--shadow);border:2px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.padhint{text-align:center;font-size:13px;color:var(--sub);padding:2px 8px calc(env(safe-area-inset-bottom) + 8px)}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(20,10,30,.92);overflow:auto;-webkit-overflow-scrolling:touch}
#viewer img{display:block;max-width:100%;max-height:100%;margin:auto;position:absolute;inset:0;background:#fff}
#viewer.zoom img{max-width:none;max-height:none;position:static;margin:0}
#viewer .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:48px;height:48px;border-radius:24px;border:0;background:var(--acc);color:#fff;font-size:20px;z-index:2}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--acc2);color:#fff;padding:12px 20px;border-radius:999px;z-index:100;font-size:15px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;box-shadow:0 4px 0 var(--acc2-d)}
@media (max-width:420px){.row2{grid-template-columns:1fr}.btn.sm{padding:0 10px}}
</style>
</head>

/* ---------- 保存（IndexedDB） ---------- */
const DB={db:null,mem:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('ronsho-cards',1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('cards'))d.createObjectStore('cards',{keyPath:'id'});if(!d.objectStoreNames.contains('imgs'))d.createObjectStore('imgs',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{try{this.db.close()}catch(_){}};res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})},
  async init(){try{await this.open()}catch(e){this.mem={cards:new Map(),imgs:new Map(),kv:new Map()}}},
  _tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})},
  async run(store,mode,fn){try{return await this._tx(store,mode,fn)}catch(e){try{this.db.close()}catch(_){}await this.open();return this._tx(store,mode,fn)}},
  async all(st){if(this.mem)return[...this.mem[st].values()];return this.run(st,'readonly',s=>s.getAll())},
  async get(st,k){if(this.mem)return this.mem[st].get(k);return this.run(st,'readonly',s=>s.get(k))},
  async put(st,v,k){if(this.mem){this.mem[st].set(k===undefined?v.id:k,v);return}return this.run(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k))},
  async del(st,k){if(this.mem){this.mem[st].delete(k);return}return this.run(st,'readwrite',s=>s.delete(k))},
  async putMany(st,vs){if(!vs.length)return;if(this.mem){vs.forEach(v=>this.mem[st].set(v.id,v));return}return this.run(st,'readwrite',s=>{vs.forEach(v=>s.put(v))})},
  async keys(st){if(this.mem)return[...this.mem[st].keys()];return this.run(st,'readonly',s=>s.getAllKeys())},
  async delMany(st,ks){if(!ks.length)return;if(this.mem){ks.forEach(k=>this.mem[st].delete(k));return}return this.run(st,'readwrite',s=>{ks.forEach(k=>s.delete(k))})},
  async clear(st){if(this.mem){this.mem[st].clear();return}return this.run(st,'readwrite',s=>s.clear())}
};

/* ---------- 書式：{{隠す}} と [[y|マーカー]] ---------- */
function parseMU(s){
  s=String(s||'');const text=[],cl=[],mk=[],map=[];let inC=false,col='',i=0;
  while(i<s.length){
    if(!inC&&s.startsWith('{{',i)){inC=true;i+=2;continue}
    if(inC&&s.startsWith('}}',i)){inC=false;i+=2;continue}
    if(!col&&s.startsWith('[[',i)&&/[ypbg]/.test(s[i+2]||'')&&s[i+3]==='|'){col=s[i+2];i+=4;continue}
    if(col&&s.startsWith(']]',i)){col='';i+=2;continue}
    text.push(s[i]);cl.push(inC);mk.push(col);map.push(i);i++;
  }
  return {text:text.join(''),cl,mk,map};
}
function serMU(m){
  let out='',inC=false,col='';
  for(let i=0;i<m.text.length;i++){const c=m.cl[i],k=m.mk[i];
    if(col&&(k!==col||c!==inC)){out+=']]';col=''}
    if(inC&&!c){out+='}}';inC=false}
    if(!inC&&c){out+='{{';inC=true}
    if(!col&&k){out+='[['+k+'|';col=k}
    out+=m.text[i];}
  if(col)out+=']]';if(inC)out+='}}';return out;
}
function modify(m,a,b,op){for(let i=Math.max(0,a);i<Math.min(b,m.text.length);i++){if(op==='hide')m.cl[i]=true;else if(op==='unhide')m.cl[i]=false;else if(op==='clear')m.mk[i]='';else m.mk[i]=op}}
function srcToText(m,p){let n=0;while(n<m.map.length&&m.map[n]<p)n++;return n}
function renderMU(s,reveal){
  const m=parseMU(s);let h='',i=0,g=0,prevC=false;const L=m.text.length;
  while(i<L){let j=i;while(j<L&&m.cl[j]===m.cl[i]&&m.mk[j]===m.mk[i])j++;
    let t=esc(m.text.slice(i,j));if(m.mk[i])t='<span class="mk mk-'+m.mk[i]+'">'+t+'</span>';
    if(m.cl[i]){if(!prevC)g++;t='<span class="cz'+(reveal?'':' hid')+'" data-g="'+g+'">'+t+'</span>'}
    h+=t;prevC=m.cl[i];i=j;}
  return h;
}

async function load(){
  await DB.init();
  const g=k=>DB.get('kv',k).catch(()=>undefined);
  const [cards,set,hist,seeded,lastBk,sess,home,lastDeck]=await Promise.all([DB.all('cards').catch(()=>[]),g('settings'),g('hist'),g('seeded'),g('lastBackup'),g('session'),g('home'),g('lastDeck')]);
  const [dels,sync,chg]=await Promise.all([g('dels'),g('sync'),g('chg')]);A.dels=dels||{};A.sync=Object.assign({repo:'',token:'',auto:true,last:0,err:'',pushed:0},sync||{});A.chg=chg||0;
  A.cards=(cards||[]).map(normCard).sort((a,b)=>a.c-b.c);
  A.set=Object.assign({fs:20,ls:0,lh:1.9,theme:'dark',pencil:false,titleFront:false,imgsize:60},set||{});
  // 配色の既定をダークに変更：以前の既定（自動）のままだった端末は、一度だけダークに切り替える
  if(!A.set.dk){if(A.set.theme==='auto')A.set.theme='dark';A.set.dk=1;DB.put('kv',A.set,'settings').catch(()=>{})}
  A.hist=hist||{};A.lastBackup=lastBk||0;A.saved=(sess&&sess.ids&&!sess.done)?sess:null;A.lastDeck=lastDeck||'';
  if(home)A.home=Object.assign(A.home,home);
  if(!['off','ok','x'].includes(A.home.rep))A.home.rep=(home&&home.repeat===false)?'off':'ok';
  if(!seeded&&!A.cards.length){A.cards=samples();await DB.putMany('cards',A.cards).catch(()=>{});await DB.put('kv',true,'seeded').catch(()=>{})}
  if(MIG.size){const sm={};samples().forEach(x=>{sm[x.id]=x});const ch=A.cards.filter(c=>MIG.has(c.id));ch.forEach(c=>{if(c.sample&&sm[c.id])c.f=sm[c.id].f});await DB.putMany('cards',ch).catch(()=>{});MIG.clear()}
  reindex();applySettings();
}
function applySettings(){const r=document.documentElement;r.style.setProperty('--fs',A.set.fs+'px');r.style.setProperty('--ls',A.set.ls+'em');r.style.setProperty('--lh',A.set.lh);r.style.setProperty('--imgmax',(A.set.imgsize||60)+'vh');r.dataset.theme=A.set.theme}

const chip=(act,label,on,val)=>`<button class="chip${on?' on':''}" data-act="${act}"${val!=null?` data-v="${esc(val)}"`:''}>${label}</button>`;
const seg=(scope,k,opts,cur,cls)=>`<div class="seg${cls?' '+cls:''}">${opts.map(([v,l])=>`<button data-act="seg" data-s="${scope}" data-k="${k}" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
function decksOf(cards){const m=new Map();for(const c of cards||A.cards)m.set(c.deck,(m.get(c.deck)||0)+1);return[...m].sort((a,b)=>a[0].localeCompare(b[0],'ja'))}
function tagsOf(cards){const m=new Map();for(const c of cards)for(const t of c.tags)m.set(t,(m.get(t)||0)+1);return[...m].sort((a,b)=>a[0].localeCompare(b[0],'ja'))}
function poolBase(){const H=A.home;return A.cards.filter(c=>(!H.decks.length||H.decks.includes(c.deck))&&(!H.tags.length||c.tags.some(t=>H.tags.includes(t))))}
function modeFilter(cs,mode){return cs.filter(c=>mode==='all'||(mode==='weak'&&c.st.last>=2)||(mode==='mid'&&c.st.last===2)||(mode==='ng'&&c.st.last===3)||(mode==='new'&&!c.st.last)||(mode==='notok'&&c.st.last!==1))}

VIEWS.home=function(){

/* ---------- 学習 ---------- */
function startSession(ids){
  if(!ids.length){toast('対象のカードがありません');return}
  A.S={ids:ids.slice(),all:ids.slice(),idx:0,round:1,next:[],first:[0,0,0,0],res:{},rep:A.home.rep,repeat:A.home.rep!=='off',order:A.home.order,flip:false,reveal:false,done:false};
  A.undo=[];Ink.undo=[];saveSess();openStudy();
}
function orderIds(ids){return A.home.order==='rand'?shuffle(ids.slice()):ids.slice().sort((a,b)=>(A.byId.get(a).c-A.byId.get(b).c))}
function curCard(){const S=A.S;return S&&!S.done?A.byId.get(S.ids[S.idx])||null:null}
function advanceRound(){const S=A.S;if(S.repeat&&S.next.length){S.ids=S.order==='rand'?shuffle(S.next.slice()):S.next.slice();S.next=[];S.idx=0;S.round++}else S.done=true}
function fixCur(){const S=A.S;let c=null;while(!S.done&&!(c=curCard())){if(S.idx<S.ids.length)S.ids.splice(S.idx,1);else advanceRound()}return c}
function openStudy(){
  A.view='study';A.tool='';Ink.mode=false;Ink.cur=null;Ink.fs=null;
  Ink.k=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';
  const st=$('#study');st.hidden=false;$('#app').hidden=true;
  st.innerHTML=`<div class="sbar sstudy"><button class="btn sm" data-act="sEnd">終了</button><span class="tgrp keepsel" id="tools"><button class="btn sm" data-act="tool" data-t="mark" id="tMark">マーカー</button><button class="btn sm" data-act="tool" data-t="pen" id="tPen">手書き</button><button class="btn sm" data-act="lay" id="tLay"></button></span><div class="prog" id="prog"></div><button class="btn sm" data-act="sUndo" id="bUndo">取消</button><button class="btn sm" data-act="sReveal" id="bRev">全表示</button><button class="btn sm" data-act="sEdit" id="bEdit">編集</button></div>
  <div class="tpanel keepsel" id="tpanel" hidden></div>
  <div class="smain"><div class="cscroll" id="cs"><div id="cardBox"></div></div>
  <div class="abar" id="abar"></div></div>`;
  // 指（touch）はtouchイベントで受ける（iPadでポインタイベントが打ち切られるため）。マウス・Pencilはポインタイベント。
  const cs=$('#cs');
  cs.addEventListener('pointerdown',swipeDown);
  cs.addEventListener('pointerup',swipeUp);
  cs.addEventListener('pointercancel',swipeCancel);
  cs.addEventListener('touchstart',touchStart,{passive:true});
  cs.addEventListener('touchend',touchEnd,{passive:true});
  cs.addEventListener('touchcancel',swipeCancel,{passive:true});

function disconnectROs(){A.ros.forEach(r=>r.disconnect());A.ros=[]}
function fieldHTML(c,k,reveal,cls){const v=c.f[k];if(!v||!String(v).trim())return'';return(cls?'':`<div class="lab">${LAB[k]}</div>`)+`<div class="fld${cls?' '+cls:''}" data-k="${k}">${renderMU(v,reveal)}</div>`}
function imgsHTML(c,side){const a=c.img[side]||[];return a.length?`<div class="imgs">${a.map(id=>`<img data-img="${esc(id)}" alt="">`).join('')}</div>`:''}
function relHTML(c,rv){const a=c.img.rel||[],t=c.f.rel&&String(c.f.rel).trim();if(!a.length&&!t)return'';return`<div class="relbox">${a.map(id=>`<img data-img="${esc(id)}" alt="">`).join('')}${t?`<div class="fld reltxt" data-k="rel">${renderMU(c.f.rel,rv)}</div>`:''}</div>`}

}
function renderStudyCard(keepScroll){

  $('#bUndo').disabled=!A.undo.length;

function renderSummary(){
  const S=A.S,f=S.first,tot=f[1]+f[2]+f[3],pct=tot?Math.round(f[1]/tot*100):0;

  $('#abar').innerHTML=`<div class="col">${weak.length?`<button class="btn pri big" data-act="again" data-w="1">1周目で△✖だった${weak.length}枚をもう一度</button>`:''}<button class="btn big" data-act="again">同じカードをもう一度</button><button class="btn big" data-act="sHome">ホームへ</button></div>`;
}
/* 裏を表示したら、裏の先頭が画面の上に来るまで自動スクロール（画像の読み込みで位置がずれるので、読込完了時にも再調整） */
let pendBack=false;
function scrollBack(){
  if(!pendBack)return;const S=A.S;if(!S||!S.flip||A.set.layout==='h')return;
  const b=$('#studyCard .side[data-side=back]'),cs=$('#cs'),sp=$('#bspace');if(!b||!cs)return;
  // 裏が短くても先頭を上端まで持ち上げられるよう、下に画面の高さ分の余白を確保
  if(sp)sp.style.height=cs.clientHeight+'px';
  const top=b.getBoundingClientRect().top-cs.getBoundingClientRect().top;
  cs.scrollTop+=top-8;
}
function flip(){
  const S=A.S;if(!S||S.done||S.flip)return;S.flip=true;pendBack=true;saveSess();renderStudyCard(true);
  scrollBack();setTimeout(scrollBack,150);
}
function unflip(){
  const S=A.S;if(!S||S.done||!S.flip)return;flushInk();S.flip=false;S.reveal=false;pendBack=false;saveSess();renderStudyCard(true);
}
function rate(r){
  const S=A.S,c=curCard();if(!c||!S.flip)return;flushInk();
  const snap={S:JSON.stringify(S),id:c.id,st:Object.assign({},c.st),day:dayKey(),r,first:S.round===1};
  A.undo.push(snap);if(A.undo.length>200)A.undo.shift();
  if(S.round===1){
    c.st.n++;c.st[['','o','t','x'][r]]++;c.st.last=r;c.st.at=Date.now();
    const d=A.hist[snap.day]||(A.hist[snap.day]=[0,0,0]);d[r-1]++;S.first[r]++;S.res[c.id]=r;
    saveCard(c);saveHist();
  }
  const rep=S.rep||(S.repeat?'ok':'off');  // 古い保存データ（repeatのみ）にも対応
  if((rep==='ok'&&r!==1)||(rep==='x'&&r===3))S.next.push(c.id);
  S.idx++;S.flip=false;S.reveal=false;Ink.undo=[];
  if(S.idx>=S.ids.length)advanceRound();
  saveSess();renderStudyCard();
}
function skip(){
  const S=A.S,c=curCard();if(!c)return;flushInk();
  A.undo.push({S:JSON.stringify(S),id:c.id,skip:true});

function undo(front){

  if(front)A.S.flip=false;
  if(c&&u.first&&!u.skip){c.st=u.st;const d=A.hist[u.day];if(d)d[u.r-1]=Math.max(0,d[u.r-1]-1);saveCard(c);saveHist()}

function endStudy(){
  flushInk();const S=A.S;
  if(S&&!S.done&&(S.idx>0||S.round>1||S.flip)){A.saved=S;DB.put('kv',S,'session').catch(()=>{})}
  else if(S&&S.done){A.saved=null;DB.del('kv','session').catch(()=>{})}
  A.S=null;disconnectROs();Ink.mode=false;A.tool='';$('#study').innerHTML='';go('home');
  if(syncReady()&&A.chg!==A.sync.pushed)setTimeout(()=>syncNow(false),300);

/* ---------- スワイプ操作（右＝進む／左＝戻る） ---------- */
const Swipe={id:null,x:0,y:0,t:0,active:false,ok:false};
/* 手書き中は描画を優先（ただしPencilモードで指の操作のときはスワイプ・タップを有効にする） */
function swipeAllowed(isTouch){
  if(!A.S||A.S.done||A.tool==='mark')return false;
  if(Ink.mode&&!(A.set.pencil&&isTouch))return false;
  return true;
}
function gestureStart(x,y,isTouch){
  Swipe.ok=swipeAllowed(isTouch);if(!Swipe.ok)return;
  Swipe.x=x;Swipe.y=y;Swipe.t=Date.now();Swipe.active=true;
}
function gestureEnd(x,y,target){
  if(!Swipe.active||!Swipe.ok)return;Swipe.active=false;
  const s=getSelection();if(s&&!s.isCollapsed&&String(s).length)return;
  const dx=x-Swipe.x,dy=y-Swipe.y,dt=Date.now()-Swipe.t;
  // タップ：画面をタップすると、右スワイプと同じ動作（表→裏めくり／裏→次へ）
  if(Math.hypot(dx,dy)<12&&dt<450){
    if(target&&target.closest&&target.closest('.cz,img,canvas,button'))return;
    goForward();return;
  }
  if(dt>700)return;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.8){
    if(dx>0)goForward();else goBack();
  }
}
/* マウス・Apple Pencil（ポインタイベント） */
function swipeDown(e){if(e.pointerType==='touch')return;gestureStart(e.clientX,e.clientY,false)}
function swipeUp(e){if(e.pointerType==='touch')return;gestureEnd(e.clientX,e.clientY,e.target)}
function swipeCancel(e){if(e&&e.pointerType==='touch')return;Swipe.active=false}
/* 指（touchイベント）：iPadのSafariでも確実に届く */
function touchStart(e){
  if(e.touches.length!==1){Swipe.active=false;return}
  const t=e.touches[0];gestureStart(t.clientX,t.clientY,true);
}
function touchEnd(e){
  if(!Swipe.active)return;const t=e.changedTouches[0];if(!t)return;
  gestureEnd(t.clientX,t.clientY,e.target);
}
function goForward(){const S=A.S;if(!S||S.done)return;if(!S.flip)flip();else skip()}
function goBack(){const S=A.S;if(!S||S.done)return;if(S.flip)unflip();else undo()}

/* ---------- マーカー・隠す（学習画面） ---------- */
let selCache=null;
function offsetIn(root,node,off){const r=document.createRange();r.setStart(root,0);r.setEnd(node,off);return r.toString().length}
function rangeToFields(r,root){
  const out=[];
  for(const fe of $$('.fld',root)){
    if(!r.intersectsNode(fe))continue;const len=fe.textContent.length;
    const a=fe.contains(r.startContainer)?offsetIn(fe,r.startContainer,r.startOffset):0;
    const b=fe.contains(r.endContainer)?offsetIn(fe,r.endContainer,r.endOffset):len;
    if(a<b)out.push({k:fe.dataset.k,a,b});
  }
  return out;
}

let autoT=0;

/* ---------- 手書き ---------- */
const HL={y:'#ffd400',p:'#ff5c9d',b:'#3d9bff',g:'#4cc94c'};

  const colBlank=x=>{for(let y=0;y<h;y+=step){const i=(y*w+x)*4;if(!isBlankPixel(data[i],data[i+1],data[i+2],data[i+3]))return false}return true};
  let top=0,bottom=h-1,left=0,right=w-1;

  const nw=right-left+1,nh=bottom-top+1;

  if(nw>=w*0.98&&nh>=h*0.98)return src;

/* ---------- まとめて追加 ---------- */
function parseDSV(t,dl){
  const rows=[];let row=[],cell='',q=false,i=0;t=t.replace(/\r\n?/g,'\n');
  while(i<t.length){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i+=2;continue}q=false;i++;continue}cell+=c;i++;continue}
    if(c==='"'&&cell===''){q=true;i++;continue}
    if(c===dl){row.push(cell);cell='';i++;continue}
    if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';i++;continue}
    cell+=c;i++;}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function bulkRows(){const t=$('#b_txt').value;if(!t.trim())return[];const rows=parseDSV(t,t.includes('\t')?'\t':',');if(rows.length&&/^(ニックネーム|論点名?|タイトル|title)$/i.test((rows[0][0]||'').trim()))rows.shift();return rows.filter(r=>r.slice(0,6).some(x=>(x||'').trim()))}

async function exportData(){

  try{file=new File([json],name,{type:'application/json'})}catch(_){file=new Blob([json],{type:'application/json'})}

function padItem(x,it){x.strokeStyle=x.fillStyle=padColor(it.c);x.lineCap='round';x.lineJoin='round';

  const p=it.p;x.lineWidth=it.w;

  syncSave:async()=>{const repo=$('#s_repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),tok=$('#s_tok').value.trim();
    if(!repo||!tok){toast('リポジトリ名とトークンを入力してください',2500);return}
    A.sync.repo=repo;A.sync.token=tok;A.sync.err='';
    try{const info=await gh('/repos/'+repo.split('/').map(encodeURIComponent).join('/'));if(!info.private&&!confirm('このリポジトリは「公開」です。カードの内容を誰でも見られるようになります。それでも使いますか？\n（おすすめ：Privateのリポジトリを使う）'))return}
    catch(e){A.sync.err=syncErr(e);await saveSyncCfg();toast('接続できません：'+A.sync.err,4000);VIEWS.settings();setSyncStat('err');return}
    await saveSyncCfg();VIEWS.settings();setSyncStat('ok');await syncNow(true);VIEWS.settings()},
  syncOff:async()=>{if(!confirm('この端末でのクラウド同期をやめますか？（カードはこの端末とクラウドの両方に残ります）'))return;A.sync.repo='';A.sync.token='';A.sync.err='';await saveSyncCfg();setSyncStat('ok');VIEWS.settings()},
  padNew:()=>openPad(-1),
  padEdit:b=>openPad(+b.dataset.i),
  padCancel:()=>{if(Pad.items.length&&!confirm('描いた内容を破棄しますか？'))return;closePad()},
  padSave:()=>padSave(),
  padC:b=>{Pad.color=b.dataset.c;if(Pad.tool==='eraser')Pad.tool='pen';padTools()},
  padW:b=>{Pad.w=b.dataset.w;padTools()},
  padT:b=>{Pad.tool=b.dataset.t;padTools()},
  padU:()=>{const u=Pad.undo.pop();if(u){Pad.items=u;padDraw()}},
  padClr:()=>{if(!Pad.items.length)return;if(!confirm('描いた線と文字をすべて消しますか？'))return;Pad.undo.push(Pad.items.slice());Pad.items=[];padDraw()},
  vclose:()=>{$('#viewer').hidden=true;$('#viewer img').src=''}
};
const CH={
  limit:t=>{A.home.limit=+t.value;saveHome();VIEWS.home()},
  titleFront:t=>{A.set.titleFront=t.checked;saveSet()},
  pencil:t=>{A.set.pencil=t.checked;saveSet()},
  autosync:t=>{A.sync.auto=t.checked;saveSyncCfg()},
  ldeck:t=>{A.list.deck=t.value;A.list.shown=200;renderList()},
  ltag:t=>{A.list.tag=t.value;A.list.shown=200;renderList()},
  lmark:t=>{A.list.mark=t.value;A.list.shown=200;renderList()},
  lsort:t=>{A.list.sort=t.value;renderList()}
};

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#viewer')){if(t.tagName==='IMG'){$('#viewer').classList.toggle('zoom');return}if(!t.closest('[data-act]')){ACT.vclose();return}}
  const cz=t.closest('.cz');
  if(cz&&cz.closest('.card')&&!Ink.mode){const s=getSelection();if(s&&!s.isCollapsed&&String(s).length)return;const f=cz.closest('.fld');const hid=cz.classList.contains('hid');$$('.cz[data-g="'+cz.dataset.g+'"]',f).forEach(z=>z.classList.toggle('hid',!hid));return}
  const im=t.closest('.card img[data-img]');if(im&&!Ink.mode&&im.src){openViewer(im.src);return}
  const b=t.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){f(b,e)}
});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.ch;if(k&&CH[k])CH[k](t)});
document.addEventListener('mousedown',e=>{if(e.target.closest('.keepsel'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#cardBox'))selCache=null},true);
document.addEventListener('selectionchange',()=>{
  const ae=document.activeElement;if(ae&&ae.tagName==='TEXTAREA')trackTA(ae);
  if(A.view!=='study')return;const s=getSelection();if(!s||!s.rangeCount||s.isCollapsed)return;
  const r=s.getRangeAt(0),cb=$('#cardBox');if(cb&&cb.contains(r.commonAncestorContainer)){const x=rangeToFields(r,cb);if(x.length)selCache=x;
    if(A.mop&&A.tool==='mark'){clearTimeout(autoT);autoT=setTimeout(autoApply,900)}}
});
['mouseup','touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,e=>{if(A.mop&&A.tool==='mark'&&e.target.closest&&e.target.closest('#cardBox')){clearTimeout(autoT);autoT=setTimeout(autoApply,ev==='mouseup'?30:250)}}));
['select','keyup','pointerup','focusin'].forEach(ev=>document.addEventListener(ev,e=>trackTA(e.target),true));
document.addEventListener('input',e=>{const t=e.target;
  if(t.closest&&t.closest('#edit')){if(t.tagName==='TEXTAREA')autoGrow(t);updatePreview();return}
  if(t.id==='q'){clearTimeout(A.qT);A.qT=setTimeout(()=>{A.list.q=t.value;A.list.shown=200;if(A.view==='cards'&&$('#list'))renderList()},150)}
  if(t.id==='b_txt'){const n=bulkRows().length;$('#b_info').textContent=n?`${n}枚として読み取りました`:''}
});
document.addEventListener('paste',e=>{
  if(!A.E||$('#edit').hidden)return;const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  const files=[];for(const it of items)if(it.kind==='file'&&/^image\//.test(it.type)){const f=it.getAsFile();if(f)files.push(f)}
  if(!files.length)return;e.preventDefault();const side=lastTA&&lastTA.el?sideOfKey(lastTA.el.dataset.k):'back';addImages(files,side);toast({rel:'関係図',front:'表',back:'裏'}[side]+'に画像を追加');
});
$('#fileImg').addEventListener('change',e=>{const fs=[...e.target.files];if(fs.length)addImages(fs,A.imgSide||'back')});
$('#fileJson').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;let d;
  try{d=JSON.parse(await readAs(f,'text'))}catch(_){toast('ファイルを読めません',2500);return}
  if(!d||d.app!=='ronsho-cards'||!Array.isArray(d.cards)){toast('このアプリのバックアップファイルではありません',3000);return}
  if(A.impMode==='replace'&&!confirm(`今のカード${A.cards.length}枚をすべて消して、ファイルの${d.cards.length}枚に置き換えます。よろしいですか？`))return;
  try{await importData(d,A.impMode)}catch(err){toast('読み込みに失敗しました：'+(err&&err.message||err),3500)}
});
document.addEventListener('keydown',e=>{
  if(!$('#viewer').hidden&&e.key==='Escape'){ACT.vclose();return}
  if(A.view!=='study'||!$('#edit').hidden||$('#study').hidden)return;
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;const S=A.S,k=e.key;if(!S)return;
  const done=()=>{e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()};
  if(k==='Escape'){done();endStudy();return}
  if(k==='u'||k==='U'){done();undo();return}
  if((k==='e'||k==='E')&&A.tool==='pen'){done();toggleEraser();return}
  if(k==='ArrowUp'){done();undo(true);return}
  if(k==='ArrowDown'&&!S.done){done();skip();return}
  if(S.done)return;
  if(k==='Enter'){done();goForward();return}
  if(k===' '){done();goBack();return}
  if(S.flip&&(k==='1'||k==='2'||k==='3')){done();rate(+k)}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushInk()});
window.addEventListener('pagehide',flushInk);
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(A.view==='study'){Ink.k=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();redrawAll()}});

(async function init(){
  if(/^https?:$/.test(location.protocol)){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
  try{await load()}catch(e){toast('読み込みエラー：'+(e&&e.message||e),4000)}
  if(DB.mem){const w=$('#warn');w.hidden=false;w.textContent='保存できない環境です'}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  go('home');setSyncStat('ok');
  if(syncReady()&&A.sync.auto)setTimeout(()=>syncNow(false),800);
})();
})();
</script>
</body>
